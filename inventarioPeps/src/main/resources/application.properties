# ==========================================
# CONFIGURACION DE BASE DE DATOS POSTGRESQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/INVENTARIO_PEPS
spring.datasource.username=postgres
spring.datasource.password=231124
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION DE JPA/HIBERNATE
# ==========================================
# ddl-auto: update crea/actualiza tablas autom\u00c3\u00a1ticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==========================================
# CONFIGURACION DEL SERVIDOR
# ==========================================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# LOGGING
# ==========================================
logging.level.com.inventario=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# CONFIGURACION DE JACKSON (JSON)
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Guatemala
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ==========================================
# TAMA\u00c3\u0091O MAXIMO DE ARCHIVOS (para reportes)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# CONFIGURACION DE SPRING SECURITY
# ==========================================
# Deshabilitar la p\u00c3\u00a1gina de login por defecto de Spring Security
spring.security.user.name=disabled
spring.security.user.password=disabled

# ==========================================
# CONFIGURACION DE JWT (personalizable)
# ==========================================
jwt.secret=inventarioPepsSecretKey2024SuperSegura123456789
jwt.expiration=86400000

# Logging de Spring Security
logging.level.org.springframework.security=DEBUG
logging.level.com.inventario.config=DEBUG